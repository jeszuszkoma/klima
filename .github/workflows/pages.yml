name: GitHub Pages (előnézet)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Képfeldolgozó telepítése
        run: npm install --no-save sharp@0.34
      - name: Termékfotók letöltése saját tárhelyre
        run: node scripts/fetch-images.mjs
      - name: Build
        env:
          SITE_URL: https://jeszuszkoma.github.io/klima/
        run: node scripts/build.mjs
      - name: Ellenőrzés
        run: node scripts/check.mjs
      - name: Egységtesztek
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
